# Local observability stack for a model running on this machine.
#
#   engine (test/test.py or llama-server/vLLM)  127.0.0.1:3000  GET /metrics
#   prometheus  scrapes the engine every 5s      localhost:9090
#   grafana     dashboard uid "cloudlm-local"    localhost:3001  (embedded by the web app under /grafana)
#
# Run from the repo root:
#   docker compose -f deploy/docker-compose.local.yml up -d
#
# Docker Desktop routes host.docker.internal to the host, so an engine bound to
# 127.0.0.1 is reachable. On Linux the extra_hosts entry provides the same name.
services:
  prometheus:
    image: prom/prometheus:v3.4.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./prometheus/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.0
    depends_on: [prometheus]
    environment:
      # Served under the web app's /grafana prefix (Vite dev server on :5173).
      GF_SERVER_ROOT_URL: http://localhost:5173/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # Local dev only: anonymous read access so iframes render without a login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: system
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    restart: unless-stopped
